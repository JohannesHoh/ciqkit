name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # release.yml gates publishing on this exact suite

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux proves the broker core and the static checks need no GUI, no
        # SDK and no simulator. macOS and Windows are where ciqkit drives the
        # simulator; Windows also proves the parts that differ
        # there (loopback-TCP control channel, DACL-private runtime dir,
        # msvcrt leases, Git-Bash builds).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: CLI is importable and self-describing
        run: |
          ciqkit --version
          ciqkit --help
          ciqkit sim --help
          ciqkit layout --help
          ciqkit shot-score --help
          ciqkit icon --help

  sdk-mcp:
    name: sdk-mcp (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    defaults:
      run:
        working-directory: tools/sdk-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm install

      - name: Typecheck and build
        run: npm run build

      # A literal block, not a plain multi-line scalar: the ": " in the
      # "missing" message made the whole file invalid YAML, so no job ran.
      - name: Gotchas database is valid and self-consistent
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const g = JSON.parse(fs.readFileSync('data/gotchas.json', 'utf8'));
            if (!Array.isArray(g) || g.length === 0) throw new Error('empty gotchas');
            const ids = new Set();
            // The server renders only these keys; anything else (e.g. a
            // misspelt wrongCode) would ship silently invisible.
            const allowed = new Set(['id', 'title', 'api', 'tags', 'severity', 'wrong',
              'correct', 'codeWrong', 'codeCorrect', 'source']);
            for (const e of g) {
              for (const k of Object.keys(e)) {
                if (!allowed.has(k)) throw new Error(\`\${e.id ?? '?'}: unknown key \${k}\`);
              }
              for (const k of ['id', 'title', 'wrong', 'correct']) {
                if (!e[k]) throw new Error(\`\${e.id ?? '?'}: missing \${k}\`);
              }
              if (ids.has(e.id)) throw new Error(\`duplicate id \${e.id}\`);
              ids.add(e.id);
            }
            console.log(\`\${g.length} gotchas OK\`);
          "

      - name: Server starts and lists its tools without an SDK index
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 node dist/index.js | tee /tmp/mcp.out
          grep -q garmin_get_gotchas /tmp/mcp.out

      - name: Single-file bundle runs and serves gotchas
        run: |
          npm run bundle
          # stdin is held open (sleep) so the server answers before it sees EOF.
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"garmin_get_gotchas","arguments":{"query":"timer"}}}'
            sleep 3
          } | timeout 30 node dist/ciqkit-sdk-mcp.mjs | tee /tmp/bundle.out
          grep -q 'gotcha-0' /tmp/bundle.out

  no-garmin-material:
    name: no redistributed Garmin material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: A generated SDK index must never be committed
        run: |
          if git ls-files --error-unmatch tools/sdk-mcp/data/sdk-index.json 2>/dev/null; then
            echo "::error::tools/sdk-mcp/data/sdk-index.json is tracked."
            echo "It is derived from Garmin's SDK documentation and must stay local."
            exit 1
          fi
          echo "no SDK index tracked"

      - name: No SDK archives or device images
        run: |
          hits=$(git ls-files | grep -Ei '\.(iq|prg|der|jks|keystore)$|connectiq-sdk' || true)
          if [ -n "$hits" ]; then
            echo "::error::unexpected binary/SDK artefacts tracked:"; echo "$hits"; exit 1
          fi
          echo "clean"

      # examples/ and the scaffolding templates are what users copy into their
      # own projects, and what ships inside the wheel. They are the most likely
      # place for a captured screen, a built app or a signing key to slip in.
      - name: examples/ and templates carry no builds, keys, screenshots or SDK data
        run: |
          paths="examples src/ciqkit/templates"
          bad=""

          # Build outputs, signing keys, SDK index -- by name, anywhere below.
          hits=$(git ls-files $paths | grep -Ei \
            '\.(prg|iq|der|jks|keystore|pem|p12)$|(^|/)bin/|(^|/)sdk-index\.json$|connectiq-sdk' || true)
          [ -n "$hits" ] && bad="$bad$hits"$'\n'

          # PNGs: only small launcher icons under a drawables dir. A captured
          # watch screen is both bigger and (by convention) in screenshots/shots.
          max=16384
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            size=$(wc -c < "$f")
            case "$f" in
              */screenshots/*|*/shots/*|*/screenshot/*|*/shot/*)
                bad="$bad$f (in a screenshots dir)"$'\n' ;;
              */drawables*/*) [ "$size" -le "$max" ] || bad="$bad$f (${size} bytes > $max)"$'\n' ;;
              *) bad="$bad$f (PNG outside a drawables dir)"$'\n' ;;
            esac
          done < <(git ls-files $paths | grep -Ei '\.png$' || true)

          if [ -n "$bad" ]; then
            echo "::error::disallowed files in examples/ or templates:"
            printf '%s' "$bad"
            exit 1
          fi
          echo "clean"
